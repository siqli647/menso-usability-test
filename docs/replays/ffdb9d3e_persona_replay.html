<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Persona Replay - Rhiannon Braithwaite</title>
<style>
* { box-sizing: border-box; }
html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}
:root {
  --hud-color: #ff9e6d;
  --hud-ink: #ffffff;
  --app-bg: radial-gradient(1200px 600px at 20% -10%, #1b1f3a 0%, #07090f 55%, #04060b 100%);

  --text-body: rgba(255,255,255,0.92);
  --text-sub: rgba(255,255,255,0.78);
  --text-faint: rgba(255,255,255,0.62);
  --track-dim: rgba(255,255,255,0.22);
  --track-mid: rgba(255,255,255,0.65);

}
body[data-theme="light"] {

  --grid-color: rgba(15,23,42,0.45);
  --brand-text: rgba(15,23,42,0.92);
  --brand-sub: rgba(15,23,42,0.45);
  --panel-bg: rgba(255,255,255,0.78);
  --panel-border: rgba(15,23,42,0.10);
  --divider: rgba(15,23,42,0.10);
  --text-strong: #0f172a;
  --text-body: rgba(15,23,42,0.85);
  --text-sub: rgba(15,23,42,0.60);
  --text-faint: rgba(15,23,42,0.40);
  --track-dim: rgba(15,23,42,0.18);
  --track-mid: rgba(15,23,42,0.55);
  --stage-shadow: 0 30px 80px -24px rgba(15,23,42,0.25);
  --stage-ring: rgba(15,23,42,0.10);
  --live-dot: #ef4444;
}
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  color: var(--text-strong);

}
.persona-replay-shell {
  position: relative;

}
.persona-replay-shell::before {

  pointer-events: none;
}
.persona-replay-shell::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(15,23,42,.22) 1px, transparent 1.5px);
  background-size: 18px 18px;
  opacity: 0;
  pointer-events: none;
}
body[data-theme="light"] .persona-replay-shell::before { opacity: .12; }
body[data-theme="light"] .persona-replay-shell::after { opacity: .12; }
.replay-wrap {
  position: relative;

  width: min(1480px, calc(100vw - 48px));

  flex-direction: column;
  align-items: center;
  min-height: 0;
}
.brand-strip {

}
.brand-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

}
.brand-back-icon {

  stroke-linejoin: round;
}
.brand-mark {

.brand-mark-logo {

}
.brand-mark-logo.is-dark-logo { display: none; }
body[data-theme="dark"] .brand-mark-logo.is-light-logo { display: none; }
body[data-theme="dark"] .brand-mark-logo.is-dark-logo { display: block; }
.brand-title { color: var(--brand-text); font-size: 15px; font-weight: 650; letter-spacing: 0; }
.brand-subtitle {
  color: var(--brand-sub);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  white-space: nowrap;

  text-overflow: ellipsis;
}
.live-observer, .microcopy, .hud-kicker {

.live-observer { display: flex; align-items: center; gap: 8px; white-space: nowrap; }

@keyframes livePulse { 50% { opacity: .45; } }
.theme-toggle {

  align-items: center;
  gap: 4px;
  border: 1px solid var(--panel-border);

  padding: 3px;

}
.theme-button {

}
.theme-button.is-active {

}
body[data-theme="light"] .theme-button.is-active { background: rgba(15,23,42,0.08); }
.broadcast-stage {

  aspect-ratio: 16 / 10;
  flex: 0 0 auto;

}
.product-video {

  height: 100%;
  object-fit: contain;
  background: #fff;
  display: block;
}
.broadcast-topbar,
.bottom-transport {
  position: absolute;

  right: 0;
  z-index: 30;
  border-color: var(--panel-border);
  background: var(--panel-bg);

}
.broadcast-topbar { top: 0; border-bottom: 1px solid var(--panel-border); }
.topbar-inner {

}
.persona-tag { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-avatar {

}
.persona-name { color: var(--text-strong); font-size: 13px; font-weight: 750; line-height: 1.15; }
.persona-type { color: var(--text-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.topbar-divider { width: 1px; height: 28px; background: var(--divider); justify-self: stretch; }

.emotion-chip {

  padding: 5px 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  white-space: nowrap;
  justify-content: center;
  justify-self: end;
  width: max-content;
  max-width: 210px;
  min-width: 72px;
  overflow: hidden;
  text-overflow: ellipsis;
}
body[data-theme="light"] .emotion-chip {
  border-color: color-mix(in srgb, var(--hud-color) 42%, #0f172a 58%);
  background: color-mix(in srgb, var(--hud-color) 38%, #ffffff 62%);

}
.emotion-chip::before {
  content: "";

}
.step-counter { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--text-sub); letter-spacing: .12em; white-space: nowrap; text-align: right; }
.confidence-card,
.think-lyric-panel {
  position: absolute;
  top: 68px;
  z-index: 30;
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  backdrop-filter: blur(14px);
}
.confidence-card { left: 20px; width: 190px; padding: 0; background: rgba(10,15,28,.18); }
body[data-theme="light"] .confidence-card { background: rgba(255,255,255,.22); }
.confidence-card.is-collapsed { width: 190px; }
.confidence-card.is-collapsed .confidence-body { display: none; }
.think-lyric-panel { right: 20px; width: 320px; padding: 0; background: rgba(10,15,28,.22); }
body[data-theme="light"] .think-lyric-panel { background: rgba(255,255,255,.28); }
.think-lyric-panel.is-collapsed { width: 320px; }
.think-lyric-panel.is-collapsed .lyric-list { display: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-toggle {
  display: flex; width: 100%; align-items: center; justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: inherit;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.panel-toggle:active,
.is-dragging .panel-toggle { cursor: grabbing; }
.panel-toggle, .panel-toggle * { white-space: nowrap; }
.confidence-card .panel-toggle { padding: 10px 12px 6px; }
.think-lyric-panel .panel-toggle { padding: 12px 16px 8px; }
.panel-toggle .hud-kicker { pointer-events: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#confidenceToggleGlyph,
#thinkToggleGlyph { font-size: 16px; font-weight: 900; letter-spacing: 0; line-height: 1; min-width: 16px; text-align: center; }
.panel-meta { display: inline-flex; align-items: center; gap: 8px; }
.confidence-body { padding: 0 16px 16px; }
.confidence-body-main { display: grid; place-items: center; }
.confidence-ring { width: 106px; height: 106px; }
.confidence-emotion-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--text-strong);
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--hud-color) 35%, transparent));
}
.confidence-number {
  margin-top: 8px;
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
  color: var(--text-strong);
  text-shadow: 0 0 18px color-mix(in srgb, var(--hud-color) 45%, transparent);
}
.confidence-divider { height: 1px; margin: 12px 0; background: var(--divider); }
.confidence-emotion-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.confidence-emotion-pill {
  border: 1px solid color-mix(in srgb, var(--hud-color) 45%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--hud-color) 14%, transparent);
  color: var(--hud-color);
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .02em;
  white-space: nowrap;
}
body[data-theme="light"] .confidence-emotion-pill {
  border-color: color-mix(in srgb, var(--hud-color) 42%, #0f172a 58%);
  background: color-mix(in srgb, var(--hud-color) 40%, #ffffff 60%);
  color: #0f172a;
  font-weight: 650;
  box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 6px 18px rgba(15,23,42,.10);
}
.lyric-list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 12px; }
.lyric-row { width: 100%; border: 0; padding: 0; background: transparent; text-align: left; opacity: .58; transition: opacity .18s ease; cursor: pointer; }
.lyric-row.is-current { opacity: 1; }
.lyric-step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 9.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.lyric-row.is-current .lyric-step { color: var(--hud-color); }
.lyric-step-dot { width: 4px; height: 4px; border-radius: 999px; background: var(--hud-color); box-shadow: 0 0 8px var(--hud-color); }
.lyric-text { margin-top: 4px; color: var(--text-sub); font-size: 11px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lyric-row.is-current .lyric-text { color: var(--text-strong); white-space: normal; font-size: 14px; font-weight: 650; text-shadow: 0 0 18px color-mix(in srgb, var(--hud-color) 30%, transparent); }
.cursor-layer {
  position: absolute;
  inset: 0;
  z-index: 24;
  pointer-events: none;
}
.mouse-trail {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.cursor-group {
  position: absolute;
  left: 50%;
  top: 50%;
  opacity: 0;
  transition: opacity .16s ease;
}
.cursor-group.is-visible { opacity: 1; }
.recorded-cursor-scrub {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 0;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  opacity: 0;
  transform: translate(-50%, -50%);
  pointer-events: none;
  background: rgba(246, 248, 252, .54);
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 0 0 18px rgba(15,23,42,.12), inset 0 0 18px rgba(255,255,255,.32);
  backdrop-filter: blur(7px) saturate(.85);
}
.recorded-cursor-scrub.is-visible { opacity: .96; }
body[data-theme="dark"] .recorded-cursor-scrub {
  background: rgba(15, 23, 42, .34);
  box-shadow: 0 0 18px rgba(0,0,0,.24), inset 0 0 18px rgba(255,255,255,.12);
}
.menso-cursor {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 2;
  width: 24px;
  height: 31px;
  transform: translate(-2px, -2px);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.42));
}
.menso-cursor path {
  fill: var(--hud-color);
  stroke: #fff;
  stroke-width: 3;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.cursor-tooltip {
  position: absolute;
  left: 30px;
  top: 28px;
  width: max-content;
  max-width: min(420px, 34vw);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px;
  background: rgba(10,15,28,.9);
  color: #fff;
  padding: 8px 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  line-height: 1.42;
  white-space: normal;
  word-break: break-word;
  box-shadow: 0 14px 34px rgba(0,0,0,.32), 0 0 18px color-mix(in srgb, var(--hud-color) 24%, transparent);
  backdrop-filter: blur(14px);
}
.cursor-tooltip.is-hidden { display: none; }
.cursor-tooltip.is-left { left: auto; right: 8px; transform: translateX(-20px); }
.cursor-tooltip.is-up { top: auto; bottom: 8px; transform: translateY(-20px); }
.cursor-tooltip.is-left.is-up { transform: translate(-20px, -20px); }
.click-ripple {
  position: absolute;
  left: 11px;
  top: 14px;
  z-index: 1;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  border: 2px solid var(--hud-color);
  opacity: 0;
}
.click-ripple.is-on { animation: prPulse 600ms ease-out forwards; }
@keyframes prPulse {
  0% { transform: translate(-50%, -50%) scale(.4); opacity: .9; }
  100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
}
.bottom-transport { bottom: 0; border-top: 1px solid var(--panel-border); }
.transport-inner { display: flex; align-items: center; gap: 18px; padding: 12px 18px; }
.transport-buttons { display: flex; align-items: center; gap: 8px; }
.transport-btn, .play-btn {
  display: grid;
  place-items: center;
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  background: transparent;
  color: var(--text-body);
  cursor: pointer;
}
.transport-btn { width: 36px; height: 36px; }
.play-btn {
  width: 42px;
  height: 42px;
  border: 0;
  background: color-mix(in srgb, var(--hud-color) 72%, transparent);
  color: #111827;
  box-shadow: 0 0 24px color-mix(in srgb, var(--hud-color) 42%, transparent);
}
.timeline { position: relative; flex: 1; height: 48px; }
.timeline-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.timeline-segment { stroke-width: 1.05; stroke-linecap: round; transition: opacity .16s ease, stroke-width .16s ease; }
.timeline-segment.is-future { opacity: .34; }
.timeline-segment.is-current { stroke-width: 1.45; filter: drop-shadow(0 0 5px var(--hud-color)); }
.timeline-ticks { position: absolute; inset: 0; }
.timeline-tick {
  position: absolute;
  bottom: 8px;
  width: 28px;
  height: 38px;
  transform: translateX(-50%);
  border: 0;
  background: transparent;
  cursor: pointer;
}
.timeline-tick span {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 3px;
  height: 14px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: var(--track-dim);
}
.timeline-tick.is-past span { background: var(--hud-color); box-shadow: 0 0 6px var(--hud-color); }
.timeline-tick.is-current span { width: 4px; height: 28px; background: var(--hud-color); box-shadow: 0 0 14px var(--hud-color); }
.time-readout {
  min-width: 128px;
  text-align: right;
  color: var(--text-body);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  letter-spacing: .08em;
}
.time-readout strong { color: var(--hud-color); }
.hud-link {
  color: var(--text-body);
  text-decoration: none;
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 11px;
  white-space: nowrap;
}
.footer-hint {
  display: flex;
  flex: 0 0 auto;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
}
@media (max-width: 900px) {
  .persona-replay-shell { padding: 12px; }
  .replay-wrap { width: calc(100vw - 24px); height: calc(100vh - 24px); }
  .brand-strip { align-items: flex-start; flex-direction: column; width: calc(100vw - 24px); }
  .broadcast-stage { width: calc(100vw - 24px); }
  .topbar-inner { grid-template-columns: minmax(0, 1fr); align-items: flex-start; gap: 8px; }
  .persona-tag, .task-title, .emotion-chip, .step-counter { grid-column: 1; }
  .topbar-divider { display: none; }
  .task-title { width: 100%; text-align: left; }
  .emotion-chip { justify-self: start; max-width: 100%; }
  .step-counter { text-align: left; }
  .confidence-card { left: 12px; top: 112px; width: 190px; }
  .confidence-card.is-collapsed { width: 190px; }
  .think-lyric-panel { right: 12px; top: 112px; width: min(300px, calc(100% - 176px)); }
  .think-lyric-panel.is-collapsed { width: min(300px, calc(100% - 176px)); }
  .confidence-ring { width: 82px; height: 82px; }
  .cursor-tooltip { max-width: 260px; }
  .transport-inner { gap: 10px; padding: 10px; }
  .time-readout { display: none; }

</style>
</head>
