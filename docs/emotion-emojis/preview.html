<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menso Emotion Emoji Preview</title>
  <style>
    :root { color: #172033; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #64748b; max-width: 720px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .tile { margin: 0; border-radius: 18px; overflow: hidden; border: 1px solid rgba(15, 23, 42, .08); background: #fff; box-shadow: 0 12px 28px rgba(15, 23, 42, .08); }
    .swatch { min-height: 132px; display: grid; place-items: center; background: var(--emotion); }
    .swatch img { width: 74px; height: 74px; display: block; }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; font-size: 13px; }
    figcaption span { font-weight: 700; text-transform: capitalize; }
    code { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
